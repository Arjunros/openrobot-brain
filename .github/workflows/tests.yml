name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MUJOCO_GL: osmesa            # headless rendering for the camera and video tests
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install OSMesa (software OpenGL)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,video]"

      - name: Physics smoke test
        run: orb sim-check

      - name: Run tests (no API key; the live test is skipped)
        run: pytest -q
